name: CI

# 说明（P0 决策）：
#   原方案指定 Foundry（forge fmt / forge test / forge snapshot / forge invariant）。
#   因目标环境 GitHub 不可达，Foundry 分发包与 forge install 无法使用，
#   P0 已改用 Hardhat 2.x。本流水线为等价替代实现。
#
# 本地已接入的门禁（P1 完成）：
#   format:check（prettier-plugin-solidity）· lint:sol（solhint）· build · test · coverage · size
#
# 【已落地】P8 部署门禁：
#   1) 部署脚本冒烟（script/deploy.ts）在测试中被直接调用（test/p8.deploy.test.ts），
#      覆盖接线自检、时间锁排程→等待→执行、真实验证器断言、端到端冒烟提案；
#   2) 「部署确定性」独立成步（下方「门禁 6」），以两个独立进程各跑一次全链部署并比对产物，
#      对应 DoD「anvil 二次执行地址一致」。
#   3) 源码验证（浏览器可验证）需外网与 BASESCAN_API_KEY，由 `npm run verify:deployment`
#      在具备条件的环境执行，CI 不做（无密钥、也不应把地址提交到浏览器）。
#
# slither（仅标准 pip 安装路径在本机受限）：
#   本机 Windows 沙箱对删除操作 fail-closed（SAFE_DELETE_FAIL_CLOSED），
#   故标准 `pip install slither-analyzer` 流程无法在本机完成；
#   但已验证可用「下载 wheels + 手动 zipfile.extractall」绕过删除拦截，在本机实跑（见 R-P6-5）。
#   本步骤以 GitHub 托管 Linux Runner 为规范执行环境（天然可达 GitHub 拉 solc + PyPI 装 slither）。
#
# 【已落地】invariant 状态机随机测试（P6，路径 A：Hardhat + 自研）：
#   由 `npm test`（hardhat test 通配全部 test/*.test.ts）统一执行，
#   含 p6.invariants / p6b.calldata-fuzz / p6c.minimizer 三套件，已纳入本流水线门禁。

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

defaults:
  run:
    working-directory: contracts

jobs:
  build-and-test:
    name: 编译 · 测试 · 覆盖率 · 体积
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # ---------- 门禁 0a：Solidity 格式（对应原方案的 forge fmt） ----------
      - name: 格式检查
        run: npm run format:check

      # ---------- 门禁 0b：Solidity 静态分析（solhint） ----------
      - name: Solidity lint（0 warning 容忍）
        run: npm run lint:sol

      # ---------- 门禁 1：编译（solc 0.8.24） ----------
      - name: 编译合约
        run: npm run build

      # ---------- 门禁 2：单元测试 ----------
      - name: 单元测试
        run: npm test

      # ---------- 门禁 4：合约体积 ≤ 24576 字节（基于【生产】构建） ----------
      # ★ 必须排在「覆盖率」之前：
      #   `npm run coverage` 会关闭 optimizer 并向字节码注入插桩，使
      #   `ProposalFactory`（内联了 `Proposal` 的创建码）运行时代码膨胀到 ~27 KB，
      #   超过 EIP-170 的 24 KiB 上限。体积检查若基于覆盖率字节码会得到假阳性失败。
      #   生产构建（optimizer 开启）下工厂约 18 KB，真实可部署；
      #   体积门禁只应校验生产字节码，覆盖率模式下的膨胀是工具产物、并非可部署形态
      #   （测试网络的 EIP-170 限制已在 hardhat.config.ts 覆盖率模式下放开）。
      - name: 合约体积检查
        run: node ../scripts/check-contract-size.mjs

      # ---------- 门禁 4b：库链接依赖检查（同样基于生产构建） ----------
      - name: 库链接依赖检查
        run: node ../scripts/check-link-references.mjs

      # ---------- 门禁 6：部署确定性（P8 DoD「anvil 二次执行地址一致」） ----------
      # 为什么放在覆盖率之前：本门禁会以**生产配置**跑真实的部署脚本，
      #   Hardhat 可能因配置哈希变化而重新编译并覆盖 artifacts。
      #   若排在 coverage 之后，会把「覆盖率模式的非优化字节码」写回 artifacts，
      #   影响后续任何基于生产字节码的判断。放在前面可保证 artifacts 始终是生产形态。
      # 该步骤在**两个独立进程**里各跑一次部署并逐字段比对，
      #   模拟「换台机器 / 重置链 / 重新部署」，两次地址必须一致。
      - name: 部署确定性（两个独立进程 · 全新链各跑一次）
        run: npm run check:determinism

      # ---------- 门禁 3：覆盖率 ----------
      # 【必须走 npm run coverage，不能写 npx hardhat coverage】
      #   package.json 的 coverage 脚本用 cross-env 注入 COVERAGE_MODE=true，
      #   而 hardhat.config.ts 依据该变量在覆盖率模式下关闭 optimizer。
      #   若直调 npx hardhat coverage，optimizer 保持开启 → library internal 函数被内联，
      #   覆盖率归属偏移，产生 P1 已实测到的「虚假缺口」（假阴性）。二者必须一致。
      - name: 覆盖率
        run: npm run coverage
      - name: 覆盖率门槛（行覆盖 ≥ 90%）
        run: node ../scripts/check-coverage.mjs 90

      # ---------- 门禁 5：gas 基线快照 ----------
      - name: 生成 gas 基线
        run: REPORT_GAS=true npm test
        env:
          REPORT_GAS: "true"

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chainvote-artifacts
          path: |
            contracts/artifacts/
            contracts/coverage/
          retention-days: 7

  slither:
    name: Slither 静态分析（规范环境：GitHub Linux Runner；本机可用 wheels 解包实跑）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        working-directory: contracts
        run: npm ci --no-audit --no-fund

      - name: 安装 Slither
        # 版本对齐本机实跑版本（0.11.6）：DoD「Slither 无 High/Medium」的结论
        # 来自该版本的实测，CI 用同一版本才能与本地结论互相印证。
        run: pip install "slither-analyzer==0.11.6"

      - name: 运行 Slither（High / Medium 未处理即失败）
        working-directory: contracts
        # ★不要写 `--fail-on medium`：Slither 的 CLI 没有 `--fail-on <level>` 这个选项
        #   （带值的 `fail_on` 只能写在 slither.config.json 里）。
        #   写成 `--fail-on medium` 会让 argparse 直接报 unrecognized arguments 并以退出码 2 结束，
        #   表现为「红线但没有任何分析输出」——正是本轮 CI #1/#2 的失败原因。
        #   命令行对应的正确开关是下面这个无值开关 `--fail-medium`。
        run: |
          slither --version
          slither . --config-file slither.config.json --fail-medium

  secret-scan:
    name: 密钥泄漏扫描（【硬约束】）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 禁止提交 .env 与私钥形态字符串
        working-directory: .
        run: |
          set -e
          if [ -f .env ] || [ -f contracts/.env ]; then
            echo "::error::检测到 .env 文件被提交，违反硬约束"; exit 1
          fi
          if grep -rnE '^\s*(DEPLOYER_PK|RELAYER_PRIVATE_KEY)\s*=\s*0x[0-9a-fA-F]{64}' \
               --include='*.ts' --include='*.js' --include='*.sol' --include='*.json' . ; then
            echo "::error::检测到硬编码私钥，违反硬约束"; exit 1
          fi
          echo "密钥扫描通过"
